name: Credential injection Linux gate

on:
  pull_request:
    paths:
      - "pkg/mcpclient/**"
      - "pkg/localfiles/**"
      - "pkg/runtimeconfig/**"
      - ".github/workflows/credential-ci.yml"

permissions:
  contents: read

jobs:
  linux-credential-tests:
    name: Linux credential injection tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Build cache for the module cache.
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: go vet
        run: go vet ./pkg/mcpclient/... ./pkg/localfiles/... ./pkg/runtimeconfig/...

      - name: go build
        run: go build ./...

      # Run the credential-relevant package tests. On Linux the openat2
      # layer (pkg/localfiles) is active; on this runner the success-path
      # tests exercise the real kernel path.
      - name: credential package tests
        run: |
          go test -count=1 -timeout 300s \
            -run 'Credential|MaxCredentialBytes|TestStdio|TestParseMCPBinding|TestBuildMCPConfig|TestValidateCredential|TestEnsureCredential|TestOpenCredential|TestReadCredential' \
            ./pkg/mcpclient/... \
            ./pkg/localfiles/... \
            ./pkg/runtimeconfig/...
